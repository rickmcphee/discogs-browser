name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Collection browser (frontend)
        - Settings
        - Crawlers / price lookup
        - Collection or stock sync
        - Discogs login
        - Deployment / Docker
        - Other or unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `VERSION` string from `backend/version.py`, or the commit SHA.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From the in-app log viewer or `~/.discogs-browser/app.log`. Redact tokens.
      render: text
    validations:
      required: false
