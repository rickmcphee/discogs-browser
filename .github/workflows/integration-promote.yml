name: Promote integration to main

# One half of a pair: this carries `integration`'s batched Dependabot updates
# into `main`, and .github/workflows/integration-sync.yml carries `main` back
# into `integration` afterwards. The second half is not optional. The squash
# merge below advances `main` and leaves `integration` exactly where it stood,
# so on its own this workflow only ever widens the gap -- which leaves Dependabot
# bumps vetted against an ever-staler base, then promoted into a `main` they were
# never tested against.
#
# What strands those PRs as un-mergeable is a separate mechanism, worth not
# confusing with this one: integration-branch-protection's
# strict_required_status_checks_policy compares a PR's head with its own base,
# so a Dependabot PR goes "behind" whenever `integration` itself moves -- never
# because `main` did. integration-sync.yml's `refresh` job covers that half.

on:
  schedule:
    # Tuesday 06:00 UTC -- a full day after Dependabot's Monday 06:00 UTC
    # runs on `integration` (.github/dependabot.yml), so stragglers (a rebase
    # after a merge conflict, a delayed check run) land before this fires.
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Open/update the promotion PR
    runs-on: ubuntu-latest
    env:
      # `secrets` is available in jobs.<job_id>.env but NOT in a step-level
      # `if`; `env` is available in both. Reducing the key to a boolean here is
      # what lets the guard below test it at all, and it must: with the
      # variable set and the secret absent, create-github-app-token rejects the
      # empty private-key and FAILS the step, so the job dies before any
      # `|| github.token` is evaluated. Guarding on the variable alone made a
      # half-removed configuration an outage rather than the documented
      # fallback.
      APP_PRIVATE_KEY_SET: ${{ secrets.INTEGRATION_PROMOTE_APP_PRIVATE_KEY != '' }}
    steps:
      # See integration-sync.yml's SETUP block for what this app is and why it
      # is an app rather than a PAT. Guarded on both halves of the config: the
      # Client ID from `vars` directly, the key via the job-level env above
      # because the secrets context is not available in a step-level `if`.
      # A skipped step yields empty outputs, so the `|| github.token` fallback
      # below is preserved -- which guarding on only one half would not do,
      # since an empty private-key fails the step before the fallback runs.
      - name: Mint an installation token for the sync app
        id: app-token
        if: ${{ vars.INTEGRATION_PROMOTE_APP_CLIENT_ID != ''
          && env.APP_PRIVATE_KEY_SET == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRATION_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_PROMOTE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Open the integration -> main PR if there's anything to promote
        env:
          # A PR opened with the default GITHUB_TOKEN still triggers
          # fly-deploy.yml's `pull_request` checks, but GitHub puts that run in
          # an approval-required state (recursion guard on GITHUB_TOKEN-authored
          # events) -- see https://docs.github.com/en/actions/concepts/security/github_token.
          # So until the sync app is configured (Contents: read/write +
          # Pull requests: read/write on its installation), someone has to
          # click "Approve and run" on the pending workflow run in the Actions
          # tab once a week before auto-merge can complete. Configuring it
          # removes the click with no other change needed here.
          #
          # Note the app is deliberately not a bypass actor on
          # main-branch-protection, so this PR's required approving review --
          # added after PR #134 merged unreviewed -- keeps binding. A personal
          # access token owned by a bypass actor would have quietly undone
          # that, on the one PR in this repo that deploys to production.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          git fetch origin main integration

          # Ancestry (git log A..B) breaks the moment the promotion PR below
          # squash-merges: the squash commit on main has no relation to
          # integration's individual commits, so they'd look "unpromoted"
          # forever and this would fire every single week even with nothing
          # new. Compare tree content instead -- that's correctly empty once
          # main and integration hold the same files, however they got there.
          if git diff --quiet origin/main origin/integration; then
            echo "integration and main already match; nothing to promote."
            exit 0
          fi

          existing="$(gh pr list --base main --head integration --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing is already open; leaving it as-is."
            exit 0
          fi

          # A tree diff can be non-empty even with nothing to promote, if main
          # advanced on its own (an unrelated feature PR) while integration
          # didn't. GitHub's own merge-base diff for the PR would then be
          # empty and pr create fails with "No commits between" -- treat that
          # as the benign no-op it is rather than a workflow failure.
          if ! create_output="$(gh pr create \
            --base main \
            --head integration \
            --title "chore: promote this week's dependency updates to main" \
            --body "Batches this week's Dependabot updates from \`integration\` into one deploy. Opened automatically by .github/workflows/integration-promote.yml every Tuesday; auto-merges once CI is green." \
            --label dependencies 2>&1)"; then
            if echo "$create_output" | grep -qi "no commits between"; then
              echo "main has no unpromoted commits from integration despite the tree diff (main moved independently); nothing to do."
              exit 0
            fi
            echo "$create_output" >&2
            exit 1
          fi
          echo "$create_output"

          gh pr merge integration --auto --squash
