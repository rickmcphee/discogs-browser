name: Claude Assistant

# Issue events only, deliberately. This repository is public, so anyone can
# open a pull request from a fork, and a run triggered on a pull request works
# against that contributor's head. The action restores `.claude/` from the base
# branch, but a `SessionStart` hook there invokes `scripts/cloud-setup.sh`, and
# that script stays at the PR head — so a maintainer typing `@claude` on a
# hostile PR would execute the contributor's shell with this job's write token
# and the OAuth secret in its environment. Adding `pull_request_review`,
# `pull_request_review_comment`, or letting `issue_comment` through on a pull
# request all reopen that path. Do not add them until the hook is self-contained
# (https://github.com/anthropics/claude-code-action/blob/main/docs/security.md).
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude:
    # There is no Claude account to put in this repository's Assignees field,
    # so `assignee_trigger` has no username to name. The `claude` label is the
    # hand-it-over gesture instead, and needs no account to exist.
    #
    # `issue_comment` fires on pull requests too — GitHub models a PR as an
    # issue — so the comment clause excludes anything carrying `pull_request`.
    #
    # The `@claude` paths also check `author_association`, because this
    # repository is public and the action's own write-access check runs only
    # after the job has started. Without it a stranger's `@claude` comment
    # enters the concurrency group below, evicts a maintainer's queued run, and
    # is only then rejected. Applying a label already requires triage access, so
    # that path is gated by GitHub itself. This is a pre-filter, not the
    # authorisation: the action still makes the real decision.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@claude'))
    # Scoped to the job, not the workflow: a workflow-level group is entered by
    # every subscribed event before the `if` above is evaluated, and GitHub keeps
    # only one pending run per group, cancelling the previous one. An ordinary
    # comment would then evict a queued Claude request. Skipped jobs never enter
    # a job-level group, so only real requests serialise here — and between two
    # of those the later one still cancels the queued earlier one.
    concurrency:
      group: claude-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    env:
      # `secrets` is available in a job-level `env` but not in a step-level
      # `if`, so the key is reduced to a boolean here to be testable below.
      # Same shape and same reason as integration-promote.yml: with the client
      # ID set and the key absent, create-github-app-token rejects the empty
      # private key and fails the step outright.
      PR_APP_PRIVATE_KEY_SET: ${{ secrets.CLAUDE_PR_APP_PRIVATE_KEY != '' }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          # Asks for a pull request title and body alongside the work, so the
          # step below opens something readable rather than a bare "Closes #N".
          # The descriptions are the only instruction Claude gets here: a
          # `prompt` input would switch the action into automation mode and
          # break the label trigger entirely.
          claude_args: |
            --json-schema '{"type":"object","properties":{"pr_title":{"type":"string","description":"Imperative one-line pull request title for the change you committed. Empty if you committed nothing."},"pr_body":{"type":"string","description":"Pull request body filling the section headings of .github/pull_request_template.md: What changed, Verification with the commands you ran and their output, Spec drift, Checklist. Empty if you committed nothing."}},"required":[]}'

      # The action revokes its own OIDC-exchanged token in a final `always()`
      # step, so `steps.claude.outputs.github_token` is already dead here and
      # every call with it would 401. A fresh installation token is minted
      # instead. Not `github.token`: GitHub raises no workflow run for anything
      # it creates, so a pull request opened with it would carry no CI at all,
      # which is worse than the link the action already posts. That is also why
      # this does not take integration-promote.yml's `|| github.token` fallback
      # — with no app configured the right outcome is to leave the link alone.
      #
      # Only on the label. Every run cuts its own branch, so opening a pull
      # request per `@claude` comment would stack a separate one per follow-up.
      - name: Mint a token for opening the pull request
        id: pr-token
        if: >-
          steps.claude.outputs.branch_name != '' &&
          github.event_name == 'issues' && github.event.action == 'labeled' &&
          vars.CLAUDE_PR_APP_CLIENT_ID != '' && env.PR_APP_PRIVATE_KEY_SET == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLAUDE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_PR_APP_PRIVATE_KEY }}

      # A skipped mint yields an empty output, which is the "no app configured"
      # path: the issue keeps the action's prefilled link and nothing fails.
      - name: Open a pull request for Claude's branch
        if: steps.pr-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        # Every one of these values reaches the script through the environment
        # rather than `${{ }}` interpolation. An issue title is written by
        # whoever opened the issue, and interpolating one into a run block
        # substitutes it before bash parses the line, so a crafted title would
        # execute here.
        run: |
          set -euo pipefail

          # Asked over the API rather than with git. The action rewrites
          # `origin` to embed its own token and unsets the credential
          # `actions/checkout` left, so the remote still carries the token that
          # was revoked above: any git call against it answers 401, which this
          # guard would have read as "committed nothing" and silently skipped
          # every run. `gh` reads GH_TOKEN, which is the freshly minted one.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "No remote branch $BRANCH: Claude committed nothing. Nothing to open."
            exit 0
          fi

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi

          title=""
          body=""
          if [ -n "${STRUCTURED:-}" ]; then
            title=$(jq -r '.pr_title // empty' <<<"$STRUCTURED" 2>/dev/null || true)
            body=$(jq -r '.pr_body // empty' <<<"$STRUCTURED" 2>/dev/null || true)
          fi
          [ -n "$title" ] || title="$ISSUE_TITLE"
          [ -n "$body" ] || body="Opened automatically for the \`claude\` label run on this issue. Claude reported no summary, so this body is a placeholder: read the diff."

          printf '%s\n\nCloses #%s\n' "$body" "$ISSUE_NUMBER" > "$RUNNER_TEMP/pr-body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
