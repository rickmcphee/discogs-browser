name: Claude Assistant

# Issue events only, deliberately. This repository is public, so anyone can
# open a pull request from a fork, and a run triggered on a pull request works
# against that contributor's head.
#
# The specific hole that first forced this narrowing is closed. The action
# restores `.claude/` from the base branch, and the `SessionStart` hook there
# used to invoke `scripts/cloud-setup.sh`, which stays at the PR head — so a
# maintainer typing `@claude` on a hostile PR would have executed the
# contributor's shell with this job's write token and the OAuth secret in its
# environment. That hook now goes through `.claude/hooks/session-start.sh`,
# which is restored from the base branch too and declines to provision anything
# it cannot establish is trusted. See
# docs/specifications/shaping/2026-08-29-session-start-hook-pr-safety-design.md
#
# What remains is not a bug awaiting a fix. It is that this job holds
# `contents: write` and the OAuth secret while reading a fork's code, and code
# that is read is code that can carry instructions. Adding
# `pull_request_review`, `pull_request_review_comment`, or letting
# `issue_comment` through on a pull request each widen that surface, and are a
# deliberate open choice to be taken on their own merits rather than waved
# through as a consequence of the hook fix
# (https://github.com/anthropics/claude-code-action/blob/main/docs/security.md).
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude:
    # There is no Claude account to put in this repository's Assignees field,
    # so `assignee_trigger` has no username to name. The `claude` label is the
    # hand-it-over gesture instead, and needs no account to exist.
    #
    # `issue_comment` fires on pull requests too — GitHub models a PR as an
    # issue — so the comment clause excludes anything carrying `pull_request`.
    #
    # The `@claude` paths also check `author_association`, because this
    # repository is public and the action's own write-access check runs only
    # after the job has started. Without it a stranger's `@claude` comment
    # enters the concurrency group below, evicts a maintainer's queued run, and
    # is only then rejected. Applying a label already requires triage access, so
    # that path is gated by GitHub itself. This is a pre-filter, not the
    # authorisation: the action still makes the real decision.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@claude'))
    # Scoped to the job, not the workflow: a workflow-level group is entered by
    # every subscribed event before the `if` above is evaluated, and GitHub keeps
    # only one pending run per group, cancelling the previous one. An ordinary
    # comment would then evict a queued Claude request. Skipped jobs never enter
    # a job-level group, so only real requests serialise here — and between two
    # of those the later one still cancels the queued earlier one.
    concurrency:
      group: claude-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
