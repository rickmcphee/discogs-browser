name: Claude Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # There is no Claude account to put in this repository's Assignees field,
    # so `assignee_trigger` has no username to name. The `claude` label is the
    # hand-it-over gesture instead, and needs no account to exist.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    # Scoped to the job, not the workflow: a workflow-level group is entered by
    # every comment event before the `if` above is evaluated, and GitHub keeps
    # only one pending run per group, cancelling the previous one. An ordinary
    # comment would then evict a queued Claude request. Skipped jobs never enter
    # a job-level group, so only real requests serialise here — and between two
    # of those the later one still cancels the queued earlier one.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
