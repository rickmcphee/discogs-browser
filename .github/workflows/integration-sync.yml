name: Sync integration with main

# Two jobs, for two different failures. Keeping them apart matters, because
# they have different causes and only one of them is about drift.
#
#   `refresh` -- *both* branch rulesets set
#   strict_required_status_checks_policy, which compares a PR's head with *its
#   own base*. So every open PR turns un-mergeable ("behind") the moment
#   anything at all lands on the branch it targets: for `integration`, a
#   Dependabot bump merging or the sync job below; for `main`, every PR that
#   merges. It stays that way until something moves its head forward, and
#   nothing used to.
#
#   Note the comparison really is head-against-*own*-base, and widening this
#   job to `main` does not change that. `integration` trailing `main` still
#   does not by itself make a single integration-based PR "behind", and `main`
#   advancing does not make one behind either -- what it makes behind is every
#   PR based on `main`, which is its own instance of the same failure rather
#   than a consequence of the drift `sync` exists to fix.
#
#   `sync` -- integration-promote.yml squash-merges `integration` into `main`,
#   which advances `main` and leaves `integration` exactly where it stood. With
#   nothing carrying `main` back, Dependabot bumps are vetted against an
#   ever-staler base and then promoted into a `main` they were never tested
#   against.
#
# Both bit at once on 2026-08-25: six Dependabot PRs sat unmergeable, the oldest
# for a fortnight, against an `integration` that had by then fallen 64 commits
# behind `main`. Fixing either alone would have left the other.
#
# Note both jobs go through a PR rather than pushing to `integration` directly:
# that ruleset requires a pull request and lists no bypass actors, so a direct
# push is rejected however the workflow authenticates.
#
# SETUP: the sync app is a prerequisite for the first sync, not just a
# convenience. That sync carries this very file plus a change to
# integration-promote.yml, and GITHUB_TOKEN may not create or update anything
# under .github/workflows/, so the push is rejected outright without a token
# holding Workflows: write. Later syncs only need it when `main` has touched a
# workflow file. It separately removes the weekly "Approve and run" click
# described on the sync step below; the two are unrelated, and the second
# reason is the weaker one.
#
# Configure it as a GitHub App installed on this repository, with Contents,
# Pull requests, Issues and Workflows all read/write. Its Client ID goes in the
# repository variable INTEGRATION_PROMOTE_APP_CLIENT_ID, its private key in the
# secret INTEGRATION_PROMOTE_APP_PRIVATE_KEY. Every job below mints its own
# installation token: those expire after an hour, so unlike the PAT this
# replaces there is nothing durable to store, and step outputs do not cross
# job boundaries.
#
# An App rather than a personal access token, deliberately. A PAT would make
# every promotion PR the token owner's own, and main-branch-protection lists
# that user as a bypass actor -- so the approving review it started requiring
# after PR #134 merged unreviewed would stop binding on precisely the PR that
# deploys. The App is a separate identity and no ruleset's bypass actor, so
# that review keeps binding. It has no expiry to lapse silently past the
# `|| github.token` fallbacks either.

on:
  push:
    branches:
      - main
      - integration
  schedule:
    # 05:00 UTC daily -- an hour ahead of Dependabot's Monday 06:00 UTC run
    # (.github/dependabot.yml), so Monday's PRs are cut from an `integration`
    # that already matches `main`. The daily cadence is the safety net for the
    # push triggers above, and which of them is the safety net depends on how
    # this workflow is authenticated.
    #
    # A push made with GITHUB_TOKEN starts no further workflow run (GitHub's
    # recursion guard). Where this falls back to it, the auto-merges below are
    # invisible to exactly the triggers that need them: the promotion PR
    # advances `main` with no `push: main` event to drive `sync`, and the sync
    # PR advances `integration` with no `push: integration` event to drive
    # `refresh`. Each trigger is blind to the one merge it most needs to see,
    # and the cron is the only thing covering either.
    #
    # With the sync app configured -- a prerequisite anyway, see SETUP above
    # -- the recursion guard does not apply: those merges are authenticated by
    # an installation token, a distinct identity, and do emit their push
    # events, so the triggers work and the cron is a backstop rather than the
    # mechanism. It stays because the fallback is reachable without anyone
    # intending it, by the variable or secret being removed.
    #
    # Both jobs no-op cheaply when there is nothing to do.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Labels are issues-scoped, even on a PR. Without this the sync PR's `dirty`
  # path cannot attach CONFLICT_LABEL, and that label is the only thing stopping
  # a later run re-arming auto-merge under someone's hand-written conflict
  # resolution. (`refresh` no longer needs this scope -- it stopped commenting
  # on PRs when the recreate path was removed -- but `sync` still does.)
  issues: write

concurrency:
  group: integration-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/integration-sync
  # The last commit `main` and `integration` genuinely shared before either
  # branch existed in its current form. While git still derives this as their
  # merge base, no merge commit has ever linked them -- see the guard in `sync`.
  FROZEN_BASE: b24e568e76bc927888e62c658e210104aa1be0d6
  # Applied to a sync PR whose conflict someone has to resolve by hand. It is
  # what stops the next run re-arming auto-merge underneath them; see the
  # `dirty` branch and the re-arm guard.
  CONFLICT_LABEL: sync-conflict-needs-hand-merge
  # How long a pending check on a sync PR goes on shielding a failed one, in
  # seconds. Six hours: this repository's checks finish in minutes, so the grace
  # period never expires while anything is genuinely running, and a check still
  # pending after it is hung rather than slow. See the `blocked` branch, where
  # the alternative to a bound is a failed required check staying unreported for
  # as long as some optional check sits queued.
  PENDING_CHECK_GRACE: 21600

jobs:
  sync:
    name: Merge main into integration
    # Every trigger, including a push to `integration`, which is cheap: the
    # containment test below answers from refs alone and exits.
    runs-on: ubuntu-latest
    env:
      # `secrets` is available in jobs.<job_id>.env but NOT in a step-level
      # `if`; `env` is available in both. Reducing the key to a boolean here is
      # what lets the guard below test it at all, and it must: with the
      # variable set and the secret absent, create-github-app-token rejects the
      # empty private-key and FAILS the step, so the job dies before any
      # `|| github.token` is evaluated. Guarding on the variable alone made a
      # half-removed configuration an outage rather than the documented
      # fallback.
      APP_PRIVATE_KEY_SET: ${{ secrets.INTEGRATION_PROMOTE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint an installation token for the sync app
        id: app-token
        # Both halves of the configuration are tested, and each is reached
        # differently. The secrets context is not available in a step-level
        # `if` at all -- GitHub's context table allows only github/needs/
        # strategy/matrix/job/runner/env/vars/steps/inputs there -- so the key
        # is tested via the job-level env above, where secrets IS available.
        # The Client ID is not secret and is read directly from `vars`.
        # Testing only one leaves the other half able to fail the step outright
        # instead of falling back. A skipped step yields empty outputs, so each
        # `|| github.token` below still degrades exactly as documented.
        if: ${{ vars.INTEGRATION_PROMOTE_APP_CLIENT_ID != ''
          && env.APP_PRIVATE_KEY_SET == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRATION_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_PROMOTE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # actions/checkout persists whichever token it used as the git
          # credential for every later push in this job. GH_TOKEN below only
          # authenticates the `gh` CLI, so without this line `git push` would
          # authenticate as GITHUB_TOKEN even where the sync app is
          # configured -- and GITHUB_TOKEN may not create or update files
          # under .github/workflows/. The first sync necessarily carries
          # exactly that: this workflow file, and the promote workflow's
          # comment. Distinct from the parked-CI caveat below, and not fixed
          # by it.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Open/update the sync PR if integration has fallen behind
        id: sync
        env:
          # Same caveat as integration-promote.yml: a PR opened with the default
          # GITHUB_TOKEN gets its fly-deploy.yml checks parked in an
          # approval-required state, and `integration` cannot merge without
          # "Backend tests" and "Frontend tests" reporting, so auto-merge below
          # waits on someone clicking "Approve and run". Configuring the sync
          # app removes the click for both workflows: its installation token is
          # a distinct identity from github-actions[bot], so the runs it starts
          # are not GITHUB_TOKEN-authored and are not held for approval.
          # The installation needs Contents: read/write, Pull requests:
          # read/write, Issues: read/write (the conflict label) and Workflows:
          # read/write. Workflows is not optional and not covered by Contents
          # -- without it the first sync's push is rejected for carrying this
          # very file, which is the failure diagnosed at the push below.
          #
          # Parked, not absent -- worth stating plainly because the opposite is
          # a natural reading of GitHub's recursion guard, and a reviewer has
          # already raised it once. On PR #182, opened by github-actions[bot]
          # with this same fallback, the "CI / Fly Deploy" run was created at
          # 06:26:44, three seconds after the PR at 06:26:41; it then sat until
          # run_attempt 2 started at 11:56:18 with triggering_actor=rickmcphee,
          # and the PR merged at 11:59:50. The run exists and is approvable,
          # so an unconfigured app costs a weekly click rather than making the
          # PR permanently unmergeable -- which is why the fallback stays
          # rather than being turned into a hard failure.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every branch ref, pruned, and no `|| true`. Fetching $SYNC_BRANCH
          # by name needed one for the case where it does not exist -- which
          # swallowed transport and auth failures too, and an empty $remote_tip
          # from a failed fetch reads as "no branch to preserve", disarming the
          # very guard it feeds. Fetching the whole namespace makes an absent
          # branch simply an absent ref, so a genuine failure can stay fatal.
          # --prune, so a branch deleted on merge does not leave a stale tip
          # behind that the guard would refuse to push past forever.
          #
          # No --tags: the marker and pending tags this used to maintain are
          # gone, and nothing here reads a tag any more.
          git fetch --quiet --prune origin "+refs/heads/*:refs/remotes/origin/*"

          arm_auto_merge() {  # $1 = PR number
            # --merge, with no squash fallback, and this is load-bearing rather
            # than a preference. A squash would land the sync as a single commit
            # carrying no parent link to `main`, re-freezing git's merge base at
            # that point for good and bringing back the recorded-marker protocol
            # this replaced. Failing loudly is the correct response to merge
            # commits being unavailable.
            if ! gh pr merge "$1" --repo "$REPO" --auto --merge; then
              echo "::error::could not arm auto-merge on sync PR #$1 with a merge commit. A squash is not an acceptable fallback here -- it would re-freeze git's merge base between main and integration. Check that the repository allows merge commits and that allowed_merge_methods on integration-branch-protection includes merge."
              exit 1
            fi
          }


          # git's own merge base is authoritative, and that is a recent
          # property of this repository rather than a given. Both directions
          # used to squash-merge, and a squash records no parent link back to
          # the branch it came from, so neither branch ever became an ancestor
          # of the other and `git merge-base main integration` sat frozen at
          # b24e568e (2026-08-10) no matter how far either branch moved --
          # which is the source of conflicts on files nobody had changed on
          # both sides. This workflow used to carry a recorded marker and two
          # tags to work around it.
          #
          # #186 is the one-time merge commit that unfreezes it, and the
          # guard below refuses to run until it has landed. Every sync after it
          # lands as a merge commit too (never a squash -- see the
          # auto-merge calls below, which fail rather than fall back), so
          # `main`'s tip becomes a genuine ancestor of `integration` each time
          # one merges and the base stays current with nothing to maintain.
          #
          # Which makes this the whole "is there anything to bring over"
          # question: real ancestry, not a tree comparison standing in for it.
          # Until a merge commit has ever linked the branches, git's derived
          # base IS the frozen one, and merging from it reproduces exactly the
          # conflicts this rewrite exists to stop producing. That is reachable
          # by merge order alone -- this workflow landing before the bootstrap
          # sync does it -- so check rather than assume. Self-retiring: once the
          # bootstrap lands the base moves and this never fires again.
          if [ "$(git merge-base origin/main origin/integration)" = "$FROZEN_BASE" ]; then
            echo "::error::the merge base for main/integration is still $FROZEN_BASE, so no merge commit has ever linked them and the bootstrap sync has not landed. Merging from this base reproduces the frozen-base conflicts. Land the bootstrap sync PR as a MERGE COMMIT first, then re-run."
            exit 1
          fi

          if git merge-base --is-ancestor origin/main origin/integration; then
            echo "integration already contains main; nothing to sync."
            exit 0
          fi

          # Leave an open sync PR alone. Its branch may carry a conflict
          # someone resolved by hand (see the error path below), and rebuilding
          # it from scratch here would throw that away.
          #
          # isCrossRepository, because --head matches on branch *name* alone.
          # Anyone can fork this repo and open a PR from a branch called
          # chore/integration-sync, and without this filter that PR would be
          # taken for the workflow's own and handed auto-merge into a branch
          # that requires no approving review.
          existing="$(gh pr list --repo "$REPO" --base integration \
            --head "$SYNC_BRANCH" --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            # An open sync PR goes "behind" if `integration` moves while its
            # checks run, and strict branch protection then refuses to merge it.
            # Re-arming auto-merge alone would spin here for good: setting
            # nothing else would catch it up.
            # Guarded for the same reason as the poll in `refresh`: `set -e`
            # sees an assignment's command substitution, so an unguarded read
            # would abort the job on one transient 5xx -- defeating the retry
            # this loop exists to provide, and doing it with no diagnostic. A
            # read that never succeeds falls through to `unknown`, which fails
            # closed below and says why.
            sync_state=""
            for _ in 1 2 3; do
              if sync_state="$(gh api "repos/$REPO/pulls/$existing" --jq '.mergeable_state')"; then
                [ "$sync_state" != "unknown" ] && break
              else
                sync_state=""
              fi
              sleep 10
            done
            case "${sync_state:-unknown}" in
              unknown)
                # Fail closed. Falling through to the re-arm used to look
                # harmless on the grounds that arming is idempotent, but that
                # reasoning only holds if the PR is not `dirty` -- and this is
                # precisely the branch where that is unknown. A conflict blocks
                # auto-merge without clearing it, so arming a PR that turns out
                # to be conflicted means whoever resolves it by hand has their
                # resolution merged on the spot, with no label and no review.
                # That is the exact failure the `dirty` branch exists to
                # prevent, reached by not knowing rather than by deciding.
                echo "::error::could not resolve mergeable_state for sync PR #$existing after polling. Not arming auto-merge: if it is actually conflicted, arming would merge a hand-written resolution unreviewed. Re-run once GitHub settles."
                exit 1
                ;;
              behind)
                echo "Sync PR #$existing is behind; catching it up before re-arming auto-merge."
                if ! gh api -X PUT "repos/$REPO/pulls/$existing/update-branch"; then
                  # Not a warning: swallowing it re-arms auto-merge on a PR
                  # that is still behind and cannot merge under the strict
                  # policy, and reports a green run for it.
                  echo "::error::could not catch up sync PR #$existing, which is behind and cannot merge until it is."
                  exit 1
                fi
                ;;
              dirty)
                # Two independent defences, and both are attempted before
                # anything is reported: the label is durable (it survives to
                # the next run and is what blocks the re-arm), disabling is
                # immediate (it clears the request that would otherwise take a
                # resolution straight in). Neither substitutes for the other,
                # so a failure in one must not skip the other -- which is what
                # ordering them as a fail-fast chain used to do.
                label_ok=yes
                # `|| true` only because --force already makes this a no-op
                # when the label exists; the attach below is what has to work.
                gh label create "$CONFLICT_LABEL" --repo "$REPO" --color B60205 \
                  --description "Sync PR whose conflict needs resolving and merging by hand -- with a merge commit, never a squash" \
                  --force >/dev/null 2>&1 || true
                gh pr edit "$existing" --repo "$REPO" --add-label "$CONFLICT_LABEL" \
                  || label_ok=no

                # `--disable-auto` fails when there is no auto-merge request,
                # so read first and only call it when something is armed --
                # treating "nothing to disable" as a failure aborted the job
                # with auto-merge already safely off. If the read itself fails
                # we cannot tell, so try anyway and let the result decide.
                disable_ok=yes
                if dirty_automerge="$(gh pr view "$existing" --repo "$REPO" \
                     --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // empty')"; then
                  if [ -n "$dirty_automerge" ]; then
                    gh pr merge "$existing" --repo "$REPO" --disable-auto || disable_ok=no
                  fi
                else
                  gh pr merge "$existing" --repo "$REPO" --disable-auto || disable_ok=no
                fi

                if [ "$label_ok" = no ] || [ "$disable_ok" = no ]; then
                  # Stop *before* printing the resolve-and-push instructions
                  # below. Those invite exactly the push that an un-labelled,
                  # still-armed PR would merge unreviewed.
                  echo "::error::Sync PR #$existing conflicts with integration and this job could not secure it (label applied: $label_ok, auto-merge cleared: $disable_ok). Do NOT resolve the conflict yet -- a resolution could merge itself, unreviewed, into a branch that requires no approving review. Apply $CONFLICT_LABEL and turn auto-merge off by hand first; if labelling failed, check the token has Issues: write."
                  exit 1
                fi

                echo "::error::Sync PR #$existing conflicts with integration. Auto-merge is off and $CONFLICT_LABEL is applied: resolve $SYNC_BRANCH by hand, push it, and merge it deliberately -- WITH A MERGE COMMIT, not a squash. This is the one path where nothing here can enforce that, and a squash re-freezes git's merge base between main and integration for good. Setting allowed_merge_methods to merge only on integration-branch-protection removes the choice."
                exit 1
                ;;
              blocked)
                # `blocked` is two unrelated states, and only one of them is a
                # problem. integration-branch-protection requires no approving
                # review, so a sync PR is blocked either because its required
                # checks have not finished -- the normal first minutes of every
                # sync PR's life -- or because one of them FAILED.
                #
                # A failure is terminal without a person, and silent. Nothing
                # below clears it: the early-exit above never rebuilds an open
                # sync PR, so the branch keeps whatever broke it, and the re-arm
                # is a no-op on a PR already armed. The job then exits 0 and
                # every later run reports success while nothing moves.
                #
                # That is not hypothetical. Sync PR #259 failed on 2026-08-30
                # against a respx/authlib break whose fix (994487b) landed on
                # `main` hours after its branch was cut. Nothing here could ever
                # pick that fix up. It sat red for two days, holding
                # `integration` at 5adef80 and stranding promotion PR #278
                # behind it, while this workflow ran green throughout -- until
                # someone read the two PRs side by side and closed it by hand.
                #
                # Assignments, not calls inside `if` tests: there `set -e` is
                # suspended and a failing gh reads as "nothing failed", which
                # restores the very silence this branch exists to end. Both
                # rollup shapes are covered -- a CheckRun carries .status,
                # .conclusion and .name, a StatusContext .state and .context.
                #
                # Nothing is decided until the board settles, and that single
                # condition is what keeps this honest. `statusCheckRollup`
                # carries every check on the PR rather than just the branch's
                # required ones, so a failed *optional* check sitting beside a
                # required one that is merely pending would otherwise fire this
                # every run for a PR that goes on to merge perfectly well.
                # Waiting for pending to empty also removes any need to ask
                # which checks are required: with nothing left running, an
                # optional-only failure leaves the PR `unstable`, not `blocked`,
                # so it never reaches this case at all. That is why this reads
                # no `isRequired` field.
                #
                # ACTION_REQUIRED counts as waiting rather than failing. It
                # means a person has been asked for a click -- the parked
                # "Approve and run" state this workflow already documents and
                # tolerates when the token fallback is in play -- and erroring
                # on it would put a run red every week for a condition the
                # design deliberately accepts. CANCELLED and STALE get no such
                # excuse: nothing is coming for them.
                # A pending check only shields a failure while it is plausibly
                # still running. `statusCheckRollup` does not say which checks
                # are *required*, so waiting on the whole board is what keeps an
                # optional failure from firing this while a required check is
                # still going -- but read naively that same rule inverts into
                # something worse: a required check that has conclusively failed
                # would stay unreported for as long as any optional check sat
                # queued, and an optional check that hangs would bury it for
                # good. Silence is this branch's own failure mode, so it must
                # not be reachable by waiting.
                #
                # A check pending longer than PENDING_CHECK_GRACE is hung, not
                # running, and stops shielding anything. Real checks here finish
                # in minutes, so the grace period never expires mid-run and the
                # optional-failure noise stays suppressed exactly as long as it
                # should be. A pending check carrying no timestamp counts as
                # waiting: that state is transient by nature, and the next run
                # re-decides.
                blocked_waiting="$(gh pr view "$existing" --repo "$REPO" \
                  --json statusCheckRollup \
                  --jq '[ .statusCheckRollup[]? | select((((.status // "") | . == "QUEUED" or . == "IN_PROGRESS" or . == "WAITING" or . == "PENDING" or . == "REQUESTED") or ((.conclusion // "") == "ACTION_REQUIRED") or ((.state // "") | . == "PENDING" or . == "EXPECTED")) and ((.startedAt // .createdAt // "") | if . == "" then true else (fromdateiso8601 > (now - '"$PENDING_CHECK_GRACE"')) end)) ] | length')"
                blocked_failures="$(gh pr view "$existing" --repo "$REPO" \
                  --json statusCheckRollup \
                  --jq '[ .statusCheckRollup[]? | (.conclusion // .state // "") as $c | select($c == "FAILURE" or $c == "ERROR" or $c == "TIMED_OUT" or $c == "STARTUP_FAILURE" or $c == "CANCELLED" or $c == "STALE") | (.name // .context // "unnamed check") ] | unique | join(", ")')"

                if [ "$blocked_waiting" = 0 ] && [ -n "$blocked_failures" ]; then
                  # A labelled PR is someone's hand-resolved conflict. Its CI is
                  # theirs, and the label already reserves the PR from this job,
                  # so say nothing and let the re-arm guard below leave it be.
                  # Read here rather than reusing the copy further down, which
                  # is fetched after this case has had to decide.
                  blocked_labels="$(gh pr view "$existing" --repo "$REPO" \
                    --json labels --jq '.labels[].name')"
                  if ! printf '%s\n' "$blocked_labels" | grep -qx "$CONFLICT_LABEL"; then
                    echo "::error::sync PR #$existing cannot merge: $blocked_failures failed, and nothing in this workflow can clear it. An open sync PR is never rebuilt, so its branch keeps whatever broke it and auto-merge waits on a check that will not pass. Nothing in a sync PR is hand-authored unless it carries $CONFLICT_LABEL, so if the failure is already fixed on \`main\`: close #$existing, delete $SYNC_BRANCH, and re-run this workflow -- it rebuilds the branch from the current \`main\` and the fix comes with it. If the failure is not fixed on \`main\`, it is a real break and fixing it there is what unblocks the sync."
                    exit 1
                  fi
                fi
                ;;
            esac
            echo "Sync PR #$existing is already open; leaving its branch as-is."

            # Re-arming has to be conditional, or it undoes the `dirty` branch
            # one cron later: that path disables auto-merge so a hand-resolved
            # conflict gets merged by whoever resolved it, but the resolution
            # makes the PR `clean`, and an unconditional re-arm would then sweep
            # their work into an approval-free branch before they looked at it.
            # The label is what survives between runs to say so.
            #
            # Still re-arm when auto-merge is simply absent and unlabelled --
            # arming can fail after `gh pr create` succeeds, and without this the
            # PR would sit with nothing driving it.
            # Fetched into variables first, deliberately. Called inside the
            # `if` tests below, a failing `gh pr view` is invisible to `set -e`
            # -- the test simply reads false, so an API or auth error would
            # present as "no label, no auto-merge" and re-arm a PR reserved for
            # hand merging. A guard that fails open is not a guard. As
            # assignments they abort the step instead.
            pr_labels="$(gh pr view "$existing" --repo "$REPO" \
              --json labels --jq '.labels[].name')"
            # .mergeMethod, not just presence. An auto-merge request armed
            # with SQUASH lands a squash, which re-freezes git's merge base
            # permanently -- and that is not hypothetical: the previous
            # revision of this workflow armed `--auto --squash` as a fallback,
            # so any sync PR it touched still carries exactly that. Treating
            # "armed" as "safe" would let one through.
            pr_automerge="$(gh pr view "$existing" --repo "$REPO" \
              --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // empty')"

            if printf '%s\n' "$pr_labels" | grep -qx "$CONFLICT_LABEL"; then
              echo "Sync PR #$existing is labelled $CONFLICT_LABEL; leaving auto-merge off for whoever resolves it."
              exit 0
            elif [ "$pr_automerge" = "MERGE" ]; then
              echo "Sync PR #$existing already has auto-merge armed with a merge commit."
            elif [ -n "$pr_automerge" ]; then
              echo "Sync PR #$existing has auto-merge armed with $pr_automerge, which would re-freeze the merge base; re-arming with a merge commit."
              if ! gh pr merge "$existing" --repo "$REPO" --disable-auto; then
                echo "::error::sync PR #$existing has auto-merge armed with $pr_automerge and it could not be disabled. Left as-is it will land a $pr_automerge and re-freeze git's merge base. Disable auto-merge on it by hand."
                exit 1
              fi
              arm_auto_merge "$existing"
            else
              arm_auto_merge "$existing"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch off `integration` and bring `main` in -- not the reverse --
          # so the head contains integration's tip and satisfies that same
          # strict up-to-date policy on the way back in.
          git checkout -B "$SYNC_BRANCH" origin/integration

          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            # Do NOT tell anyone to push $SYNC_BRANCH and open its PR. This
            # exit happens before any PR exists, so the `dirty` path that
            # applies CONFLICT_LABEL never runs -- and a PR opened from this
            # branch is indistinguishable from one this job opened. The next
            # run adopts it, finds it clean and unlabelled, and arms
            # auto-merge, merging a hand-written resolution unreviewed. A
            # branch of their own is never adopted, and the force-push guard
            # below covers them if they use this one anyway.
            echo "::error::main and integration have both changed the same lines since they diverged. Resolve this by hand on a branch of your OWN -- not $SYNC_BRANCH, which this job rebuilds and would adopt as its own sync PR, arming auto-merge on your resolution. Branch from integration, merge main into it, resolve, and open a PR into integration, merging it deliberately with a merge commit. Unlike the frozen-base era this is a real disagreement: git derives the base from actual ancestry now, so a conflict here means both sides genuinely touched the same lines."
            exit 1
          fi

          if git diff --quiet origin/integration HEAD; then
            # Expected after a promotion: `main` advanced with content that came
            # from `integration` in the first place, so there is nothing to
            # apply. The merge commit is still the point -- it is what moves
            # `main`'s tip into `integration`'s ancestry and keeps the base
            # current -- so the PR is opened anyway, with no files changed.
            echo "no file changes (main's tip is content integration already holds); opening the PR for the merge commit alone."
          fi

          # "No open PR" does NOT make this branch disposable. The conflict
          # path above tells a person to resolve $SYNC_BRANCH by hand, push it,
          # and *then* open a PR -- and a scheduled run landing between those
          # two steps sees no open PR. Force-pushing there destroys the one
          # piece of work in this whole workflow a machine cannot reproduce.
          #
          # Overwrite only a tip this job could have produced: one already
          # contained in the merge just built, or one with an identical tree --
          # our own earlier generated merge, whose sha differs only by commit
          # timestamp, left behind when a `gh pr create` failed.
          remote_tip="$(git rev-parse -q --verify "refs/remotes/origin/$SYNC_BRANCH" || true)"
          if [ -n "$remote_tip" ] \
             && ! git merge-base --is-ancestor "$remote_tip" HEAD \
             && [ "$(git rev-parse "$remote_tip^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
            echo "::error::$SYNC_BRANCH on the remote is at $(git rev-parse --short "$remote_tip"), which this job did not create and which the merge it just built does not contain -- most likely a hand-resolved conflict pushed but not yet opened as a PR. Refusing to force-push over it. Open a PR from that branch into integration, or delete the branch if it is stale, then re-run."
            exit 1
          fi

          # --force-with-lease, not --force. The check above reads the tip as
          # of the fetch, and a person can push between that fetch and this
          # line -- exactly the window the instructions create. The lease makes
          # git re-verify at push time and reject anything that moved since.
          # An empty $remote_tip means "expect this ref not to exist", which is
          # the correct lease for the branch-absent case.
          if ! git push --force-with-lease="$SYNC_BRANCH:$remote_tip" \
                 origin "$SYNC_BRANCH"; then
            if ! git diff --quiet origin/integration HEAD -- .github/workflows/; then
              echo "::error::pushing $SYNC_BRANCH failed, and this sync carries changes under .github/workflows/ ($(git diff --name-only origin/integration HEAD -- .github/workflows/ | tr '\n' ' ')). GITHUB_TOKEN cannot create or update workflow files: configure the sync app (repository variable INTEGRATION_PROMOTE_APP_CLIENT_ID and secret INTEGRATION_PROMOTE_APP_PRIVATE_KEY) with Workflows: read/write on its installation. The checkout step above passes it to git as well as gh, so it covers this once configured."
            else
              echo "::error::pushing $SYNC_BRANCH failed."
            fi
            exit 1
          fi

          gh pr create \
            --repo "$REPO" \
            --base integration \
            --head "$SYNC_BRANCH" \
            --title "chore: sync integration with main" \
            --body "$(printf '%s\n\n%s\n\n%s' \
              'Brings `main` into `integration` so Dependabot branches from an up-to-date base, keeping any bumps `integration` is still holding. Opened automatically by .github/workflows/integration-sync.yml; auto-merges once CI is green. Nothing is authored here -- every change comes from one side or the other.' \
              '**Merge this with a merge commit, not a squash.** That is what makes `main`'"'"'s tip an ancestor of `integration` and keeps `git merge-base` current; a squash re-freezes it. See docs/specifications/shaping/2026-08-25-integration-branch-sync-design.md.' \
              'No files changed is expected right after a promotion: `main` advanced with content that came from `integration`, so there is nothing to apply and the merge commit itself is the point.')" \
            --label dependencies

          opened="$(gh pr list --repo "$REPO" --base integration \
            --head "$SYNC_BRANCH" --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')"

          # Auto-merge is the right primitive here, and safe in a way it is not
          # on `main`: integration-branch-protection requires no approving
          # review and carries no Copilot review rule, so there is no review to
          # race -- and the content merging in is main's own, already reviewed
          # on its way there.
          arm_auto_merge "$opened"
          echo "Sync PR #$opened is queued to merge."

  refresh:
    name: Catch up PRs their base branch left behind
    needs: sync
    # always(): `sync` runs on every trigger, but it can fail -- a merge
    # conflict, a push rejected for want of the workflow scope -- and a failed
    # dependency would otherwise skip this job too. Those are the moments PRs
    # most need catching up, not least.
    #
    # This job deliberately does not ask whether a sync is queued. It used to,
    # on the reasoning that `integration` was about to move and any catch-up
    # would be redone -- but a queued sync can sit for days when its checks are
    # parked awaiting approval, and every PR that falls behind meanwhile stays
    # stranded. That is the failure this workflow exists to prevent, traded
    # against nothing worse than a redundant update-branch, which is harmless.
    #
    # Every trigger, with no branch guard on the push. That guard used to skip
    # a push to `main`, correctly: while this job only routed integration-based
    # PRs, `main` moving made none of them behind and the run had nothing to
    # do. Now that it routes main-based PRs too, a push to `main` is precisely
    # the event that strands them, and skipping it would leave the daily cron
    # as the only thing catching them up -- reintroducing, for `main`, the
    # up-to-a-day lag this job exists to close.
    if: always()
    runs-on: ubuntu-latest
    env:
      # `secrets` is available in jobs.<job_id>.env but NOT in a step-level
      # `if`; `env` is available in both. Reducing the key to a boolean here is
      # what lets the guard below test it at all, and it must: with the
      # variable set and the secret absent, create-github-app-token rejects the
      # empty private-key and FAILS the step, so the job dies before any
      # `|| github.token` is evaluated. Guarding on the variable alone made a
      # half-removed configuration an outage rather than the documented
      # fallback.
      APP_PRIVATE_KEY_SET: ${{ secrets.INTEGRATION_PROMOTE_APP_PRIVATE_KEY != '' }}
    steps:
      # Minted again rather than carried over from `sync`: step outputs are
      # job-scoped, and this job runs on always() even when that one failed.
      - name: Mint an installation token for the sync app
        id: app-token
        if: ${{ vars.INTEGRATION_PROMOTE_APP_CLIENT_ID != ''
          && env.APP_PRIVATE_KEY_SET == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRATION_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_PROMOTE_APP_PRIVATE_KEY }}

      - name: Catch up every open PR that its base branch outran
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Assign first, then iterate. A command substitution in a `for` word
          # list is only a word expansion, so `set -e` never sees `gh pr list`
          # fail -- an API or auth error would become an empty list, and the job
          # would report success having refreshed nothing at all. An assignment
          # does carry the substitution's exit status.
          #
          # --limit, because `gh pr list` returns 30 by default and this step
          # promises to catch up *every* open PR, not the newest thirty.
          #
          # One query per base rather than one unfiltered query filtered in jq:
          # --base filters server-side, so the limit stays a per-base promise.
          # Listing everything and discarding the rest would silently make 200
          # a budget shared between the two bases, and a flood of PRs on one
          # could then push the other's off the end of the page.
          #
          # Each PR is carried as "<number>:<base>" because the messages below
          # name the branch a PR is behind, and naming the wrong one is worse
          # than naming none: it would send someone to look at `integration`
          # over a PR that never touched it.
          open_prs=""
          for base in main integration; do
            # A PR whose HEAD is one of the two protected branches is skipped.
            # update-branch pushes the base merge onto the *head* branch, and
            # neither ruleset permits that push: `integration` requires a pull
            # request and names no bypass actors at all, while `main`'s only
            # bypass actor is a User, not the sync app. So the call is rejected
            # for this workflow's identity either way, this job collects the
            # failure, and it exits 1 on every run for as long as such a PR is
            # open and its base has moved.
            #
            # The live case is the promotion PR: integration-promote.yml opens
            # it `--base main --head integration`, weekly, and it can wait days
            # on `main`'s required approving review. Without this, `refresh`
            # would be red for that whole window, every week. A job that is red
            # every Tuesday for a benign reason is one nobody reads, which
            # costs the "every failure is loud" goal rather than serving it.
            #
            # `main` is named here for symmetry rather than for a case that has
            # occurred: no PR in this repository has ever had `main` as its
            # head, and `sync` opens its own from SYNC_BRANCH precisely so that
            # one is never needed. But the rule this filter encodes is "a
            # protected head cannot be pushed to", and a filter that checked
            # only one of the two protected branches would not be that rule --
            # it would be a coincidence that happened to hold.
            #
            # Skipped rather than tolerated as a known failure, because nothing
            # is wrong when it happens. `sync` is what makes the promotion PR's
            # head current, by merging `main` into `integration` through a PR of
            # its own -- also the only route that keeps `git merge-base`
            # current, the reason `integration` is merge-only.
            #
            # Scoped to same-repository heads, so a fork PR that merely has a
            # branch named `main` or `integration` is an ordinary PR and still
            # gets refreshed.
            #
            # Assigned, not inlined into the `for`, for the reason spelled out
            # above: only an assignment lets `set -e` see this fail.
            base_prs="$(gh pr list --repo "$REPO" --base "$base" --state open \
                          --limit 200 --json number,headRefName,isCrossRepository \
                          --jq '.[] | select(.isCrossRepository or (.headRefName != "main" and .headRefName != "integration")) | .number')"
            for num in $base_prs; do
              open_prs="$open_prs $num:$base"
            done
          done
          # Every PR this job could not refresh, collected rather than merely
          # warned about. Warning alone let the step exit 0 having refreshed
          # nothing at all -- the same silent no-op the job exists to prevent,
          # arriving from inside the job itself.
          #
          # Each entry carries its base, so the one-line summary at the end
          # stays as useful as the per-PR warnings above it: on a mixed-base
          # run, "#222 #400" alone cannot say which branch either is behind,
          # and that summary is the annotation a reader sees first.
          failed=""

          for entry in $open_prs; do
            n="${entry%%:*}"
            base="${entry##*:}"

            # mergeable_state is computed asynchronously; a PR polled too soon
            # after its base moved answers "unknown", which is neither state
            # below and would quietly skip the one PR that needed this most.
            #
            # The read is guarded because `set -e` does see an assignment's
            # command substitution: unguarded, a single transient 5xx would
            # abort the whole job here, leaving every PR after this one
            # unrefreshed while the run ended on its own terms.
            state=""
            for _ in 1 2 3 4 5 6; do
              if state="$(gh api "repos/$REPO/pulls/$n" --jq '.mergeable_state')"; then
                [ "$state" != "unknown" ] && break
              else
                state=""
              fi
              sleep 10
            done

            case "${state:-unknown}" in
              behind)
                # Merge the base in. Deterministic, reports a status, and needs
                # nothing of the PR's author -- including Dependabot, whose own
                # branches take this happily: it leaves the bump commit in place
                # and does not close or abandon the PR.
                echo "PR #$n is behind; merging $base into it."
                if ! gh api -X PUT "repos/$REPO/pulls/$n/update-branch"; then
                  # Per-PR, so one stuck PR cannot strand the rest -- but
                  # recorded, so the step still ends red.
                  echo "::warning::could not update PR #$n (base $base) automatically"
                  failed="$failed #$n($base)"
                fi
                ;;

              dirty)
                # A conflict, which update-branch cannot fix and this job
                # cannot delegate either.
                #
                # It used to post `@dependabot recreate` on a Dependabot PR,
                # reasoning that a conflicted bump is usually a lockfile and
                # only Dependabot can regenerate one properly. That reasoning
                # still holds. The mechanism never did: Dependabot refuses
                # commands from bots outright -- "Sorry, only users with push
                # access can use that command" -- whether the comment comes
                # from github-actions[bot] or a GitHub App, and regardless of
                # the write permissions either one holds. See
                # dependabot/dependabot-core#9147.
                #
                # The path sat unexercised from the day it was written until
                # 2026-08-26, when it fired once, on PR #175, and was refused.
                # It was removed rather than reworked because every remaining
                # way to issue the command needs a real user's token, which is
                # what the app migration had just finished getting rid of.
                #
                # A warning, deliberately not a job failure: a conflicted PR
                # can sit for days, and failing here would turn every
                # subsequent run red over a condition this job cannot act on.
                # Non-Dependabot conflicts were always treated exactly this way.
                #
                # The advice below is deliberate, and the opposite of the
                # obvious move. Closing a conflicted Dependabot PR does NOT
                # queue a clean replacement: Dependabot reads a close as "skip
                # this release" and stays silent until a NEWER version ships.
                # It offers re-opening as the recovery -- and that is not
                # reliable here either, because it deletes its branch on close,
                # which makes the PR unreopenable. Both were learned on #175 on
                # 2026-08-26, by doing it.
                #
                # A person commenting the command does work. The refusal above
                # is specifically about bots; "only users with push access can
                # use that command" grants it to exactly the human being asked.
                #
                # Branched on author, because this job routes EVERY open PR on
                # either base, not only Dependabot's -- and since it widened to
                # `main`, most of what it sees is hand-written. Telling the
                # author of a hand-written PR to run a Dependabot command is
                # advice they cannot act on. The old recreate path read the
                # author too, but for two jobs at once -- gating the command
                # and choosing the wording -- so deleting the command deleted
                # the wording with it.
                #
                # Unlike that path, this read only picks which sentence to
                # print, so a failure falls back to wording that is true either
                # way rather than failing the PR. Guessing "not Dependabot" on
                # a failed read would print a claim about authorship that was
                # never established.
                author="$(gh api "repos/$REPO/pulls/$n" --jq '.user.login' 2>/dev/null || true)"
                if [ "$author" = "dependabot[bot]" ]; then
                  echo "::warning::PR #$n conflicts with $base and cannot be caught up automatically. A person with push access can comment '@dependabot recreate' on it -- that command works for people, only bots are refused. Do NOT just close it: Dependabot treats a close as 'skip this release' and will not raise it again until a newer version ships, and it deletes the branch, so the PR cannot be reopened."
                elif [ -n "$author" ]; then
                  # "whoever can push to the head branch", not "$author". The
                  # wording this replaces said only the opener could rebuild it,
                  # which is not true and could talk someone out of a repair
                  # they were entitled to make: a same-repo branch is writable
                  # by any collaborator with push access, and a fork branch by
                  # maintainers when the PR allows maintainer edits. The
                  # capability is what matters, not the identity.
                  echo "::warning::PR #$n conflicts with $base and cannot be caught up automatically. It was opened by $author, not Dependabot, so no @dependabot command applies: the branch has to be repaired by hand by someone who can push to it -- its author, any collaborator with write access if it lives in this repository, or a maintainer if it is a fork PR allowing maintainer edits."
                else
                  echo "::warning::PR #$n conflicts with $base and cannot be caught up automatically, and its author could not be read. It needs a human either way: if Dependabot opened it, someone with push access can comment '@dependabot recreate' (and should not close it); otherwise the branch has to be repaired by hand by someone who can push to it."
                fi
                ;;

              unknown)
                # Exhausted the poll without GitHub settling on an answer, or
                # every read of it failed. Falling into the catch-all below
                # would report "nothing to do" and skip the PR silently --
                # precisely what the polling is for.
                echo "::warning::could not resolve mergeable_state for PR #$n after polling; it may still be behind $base and was not refreshed."
                failed="$failed #$n($base)"
                ;;
              *)
                echo "PR #$n (base $base) is '$state'; nothing for this job to do."
                ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::could not refresh:$failed. Each is annotated with the base it may still be behind -- re-run this workflow, or update them by hand."
            exit 1
          fi
