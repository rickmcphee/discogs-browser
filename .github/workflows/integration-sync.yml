name: Sync integration with main

# Two jobs, for two different failures. Keeping them apart matters, because
# they have different causes and only one of them is about drift.
#
#   `refresh` -- integration-branch-protection sets
#   strict_required_status_checks_policy, which compares a PR's head with *its
#   own base*. So every open PR based on `integration` turns un-mergeable
#   ("behind") the moment anything at all lands on `integration` -- a Dependabot
#   bump merging, or the sync job below -- and stays that way until something
#   moves its head forward. Nothing used to. Note this has nothing to do with
#   `main`: `main` is not an input to that comparison, and `integration`
#   trailing `main` does not by itself make a single PR "behind".
#
#   `sync` -- integration-promote.yml squash-merges `integration` into `main`,
#   which advances `main` and leaves `integration` exactly where it stood. With
#   nothing carrying `main` back, Dependabot bumps are vetted against an
#   ever-staler base and then promoted into a `main` they were never tested
#   against.
#
# Both bit at once on 2026-08-25: six Dependabot PRs sat unmergeable, the oldest
# for a fortnight, against an `integration` that had by then fallen 64 commits
# behind `main`. Fixing either alone would have left the other.
#
# Note both jobs go through a PR rather than pushing to `integration` directly:
# that ruleset requires a pull request, allows only squash merges, and lists no
# bypass actors, so a direct push is rejected however the workflow authenticates.
#
# SETUP: INTEGRATION_PROMOTE_TOKEN is a prerequisite for the first sync, not
# just a convenience. That sync carries this very file plus a change to
# integration-promote.yml, and GITHUB_TOKEN may not create or update anything
# under .github/workflows/, so the push is rejected outright without a token
# holding the `workflow` scope. Later syncs only need it when `main` has
# touched a workflow file. It separately removes the weekly "Approve and run"
# click described on the sync step below; the two are unrelated, and the second
# reason is the weaker one.

on:
  push:
    branches:
      - main
      - integration
  schedule:
    # 05:00 UTC daily -- an hour ahead of Dependabot's Monday 06:00 UTC run
    # (.github/dependabot.yml), so Monday's PRs are cut from an `integration`
    # that already matches `main`. The daily cadence is the safety net for the
    # push triggers above: a push made with GITHUB_TOKEN starts no further
    # workflow run (GitHub's recursion guard), and both auto-merges in this
    # setup are made that way. The promotion PR advances `main`, so no
    # `push: main` event arrives to drive `sync`; the sync PR this workflow
    # opens advances `integration`, so no `push: integration` event arrives to
    # drive `refresh`. Each trigger is therefore blind to exactly the merge it
    # most needs to see, and the cron covers both. Both jobs no-op cheaply when
    # there is nothing to do.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: integration-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/integration-sync
  MARKER_TAG: integration-sync-base
  # The `main` commit `integration` held when this workflow was written: #184
  # synced `integration` to exactly this tree, and `git diff 43217e9
  # origin/integration` was empty at the time. It stands in for the marker tag
  # until the workflow has recorded one of its own, and is then never consulted
  # again. Without it the very first run has no base but git's inferred one,
  # which is b24e568e -- old enough to predate integration-promote.yml, so both
  # sides look like they added that file and the merge dies on an add/add
  # conflict before it can ever record a marker. Verified: merging this branch
  # into `integration` conflicts on integration-promote.yml and CLAUDE.md with
  # the inferred base, and is clean with this one.
  BOOTSTRAP_BASE: 43217e92921fe0164854b28798dfcb10792368f1
  # Stamped into every recreate request this workflow posts, and the only thing
  # the don't-ask-twice guard counts. Identity-independent on purpose: the
  # comment author is github-actions[bot] or the PAT's owner depending on which
  # token is configured, so matching on author would silently stop working the
  # day INTEGRATION_PROMOTE_TOKEN is added.
  RECREATE_MARKER: "<!-- integration-sync: recreate requested -->"

jobs:
  sync:
    name: Merge main into integration
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.sync.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # actions/checkout persists whichever token it used as the git
          # credential for every later push in this job. GH_TOKEN below only
          # authenticates the `gh` CLI, so without this line `git push` would
          # authenticate as GITHUB_TOKEN even where INTEGRATION_PROMOTE_TOKEN
          # is configured -- and GITHUB_TOKEN may not create or update files
          # under .github/workflows/. The first sync necessarily carries
          # exactly that: this workflow file, and the promote workflow's
          # comment. Distinct from the parked-CI caveat below, and not fixed
          # by it.
          token: ${{ secrets.INTEGRATION_PROMOTE_TOKEN || github.token }}

      - name: Open/update the sync PR if integration has fallen behind
        id: sync
        env:
          # Same caveat as integration-promote.yml: a PR opened with the default
          # GITHUB_TOKEN gets its fly-deploy.yml checks parked in an
          # approval-required state, and `integration` cannot merge without
          # "Backend tests" and "Frontend tests" reporting, so auto-merge below
          # waits on someone clicking "Approve and run". Adding
          # INTEGRATION_PROMOTE_TOKEN (a fine-grained PAT or GitHub App token
          # with Contents: read/write + Pull requests: read/write) removes the
          # click for both workflows.
          #
          # Parked, not absent -- worth stating plainly because the opposite is
          # a natural reading of GitHub's recursion guard, and a reviewer has
          # already raised it once. On PR #182, opened by github-actions[bot]
          # with this same fallback, the "CI / Fly Deploy" run was created at
          # 06:26:44, three seconds after the PR at 06:26:41; it then sat until
          # run_attempt 2 started at 11:56:18 with triggering_actor=rickmcphee,
          # and the PR merged at 11:59:50. The run exists and is approvable, so
          # a missing PAT costs a weekly click rather than making the PR
          # permanently unmergeable -- which is why the fallback stays rather
          # than being turned into a hard failure.
          GH_TOKEN: ${{ secrets.INTEGRATION_PROMOTE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin main integration
          git fetch --quiet origin \
            "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" 2>/dev/null || true

          # The commit on `main` that `integration` provably already holds.
          # This is the correct merge base for bringing main forward, and git
          # cannot work it out for itself: both branches only ever squash-merge,
          # so neither gains an ancestor from the other and `git merge-base`
          # stays pinned to the last commit they genuinely shared -- b24e568e,
          # 2026-08-10 -- for good. Merging against a base that old makes a
          # dependency pin `integration` has re-bumped look changed on both
          # sides, and conflicts on a file nobody actually disagrees about.
          on_main() { git merge-base --is-ancestor "$1" origin/main 2>/dev/null; }

          marker="$(git rev-parse -q --verify "refs/tags/$MARKER_TAG^{commit}" || true)"

          if [ -z "$marker" ] \
             && git rev-parse -q --verify "origin/$SYNC_BRANCH" >/dev/null 2>&1 \
             && git diff --quiet "origin/$SYNC_BRANCH" origin/integration; then
            # A sync that has already landed records its own base: this job
            # builds its merge with `main` as the second parent, and
            # `integration` holding that same tree proves the PR merged. That is
            # how the marker normally first appears -- the path that opens a
            # sync PR cannot record one at the time, since the merge has not
            # landed and recording it early would make a later run skip a sync
            # that was genuinely needed.
            #
            # Walk first parents rather than reading the tip's second parent.
            # When a sync PR falls behind, update-branch adds a merge whose
            # second parent is `integration`, so the tip's ^2 can name an
            # integration commit. Recording that as the base is not merely
            # wrong: with a base that already carries a bump `main` never had,
            # the three-way merge reads the bump as "removed on main" and drops
            # it -- cleanly, with no conflict and no warning. The synthetic
            # merge is still down the first-parent chain, and its ^2 is on main.
            for c in $(git rev-list --first-parent -n 50 "origin/$SYNC_BRANCH"); do
              p2="$(git rev-parse -q --verify "$c^2" 2>/dev/null)" || continue
              if on_main "$p2"; then
                marker="$p2"
                recover_persist=1
                echo "recovered the marker from the last landed sync: $marker"
                break
              fi
            done
          fi

          # Whatever the source, a marker has exactly one meaning: "integration
          # already holds `main` up to here". A commit that is not on `main`
          # cannot say that, and used as a merge base it invents changes neither
          # side made. Cheap to check, and it catches the whole class rather
          # than the one route that produced it.
          if [ -n "$marker" ] && ! on_main "$marker"; then
            echo "::warning::discarding marker $marker -- it is not a commit on main, so it cannot describe what integration holds"
            marker=""
            recover_persist=0
          fi

          if [ -z "$marker" ] && git cat-file -e "$BOOTSTRAP_BASE^{commit}" 2>/dev/null \
             && on_main "$BOOTSTRAP_BASE"; then
            marker="$BOOTSTRAP_BASE"
            # Before the first sync this is simply expected. Afterwards it means
            # neither the tag nor a landed sync branch survived, so a base that
            # only grows staler is standing in for something newer and the
            # frozen-base conflicts can creep back. Warn rather than fail: a hard
            # stop cannot be recovered from by the workflow itself, since every
            # path that records a marker lies past it.
            if git cat-file -e \
                 "origin/integration:.github/workflows/integration-sync.yml" 2>/dev/null; then
              echo "::warning::no $MARKER_TAG, and no landed $SYNC_BRANCH to recover one from, yet integration already carries this workflow -- record_marker is probably failing. Falling back to BOOTSTRAP_BASE, which grows staler with time; if this repeats, re-create the tag at the newest main commit integration provably holds."
            else
              echo "no $MARKER_TAG yet and integration has never been synced by this workflow; bootstrapping from $BOOTSTRAP_BASE"
            fi
          fi

          record_marker() {  # $1 = a main commit integration provably holds
            # Only ever called where that containment was just established:
            # the two nothing-to-do exits, and marker recovery below. Recording
            # it anywhere else would make a later run skip a real sync.
            git push --force --quiet origin "$1:refs/tags/$MARKER_TAG" \
              && echo "marker: integration holds main $(git rev-parse --short "$1")" \
              || echo "::warning::could not move $MARKER_TAG; the next run will try to recover it from $SYNC_BRANCH instead"
          }

          if [ "${recover_persist:-0}" = 1 ]; then
            record_marker "$marker"
          fi

          # Compare trees, not ancestry -- same squash-merge reason as above.
          if git diff --quiet origin/main origin/integration; then
            echo "integration already holds main's files; nothing to sync."
            record_marker "$(git rev-parse origin/main)"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tree difference on its own does not mean main has anything to
          # hand over: it is equally what integration's own unpromoted bumps
          # look like. Merging in that case is not just wasted work, it is the
          # spurious conflict described above, so check before attempting it.
          if [ -n "$marker" ] && git diff --quiet "$marker" origin/main; then
            echo "main has not advanced since it was last folded in; the remaining difference is integration's own."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Leave an open sync PR alone. Its branch may carry a conflict
          # someone resolved by hand (see the error path below), and rebuilding
          # it from scratch here would throw that away.
          #
          # isCrossRepository, because --head matches on branch *name* alone.
          # Anyone can fork this repo and open a PR from a branch called
          # chore/integration-sync, and without this filter that PR would be
          # taken for the workflow's own and handed auto-merge into a branch
          # that requires no approving review.
          existing="$(gh pr list --repo "$REPO" --base integration \
            --head "$SYNC_BRANCH" --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            # An open sync PR goes "behind" if `integration` moves while its
            # checks run, and strict branch protection then refuses to merge it.
            # Re-arming auto-merge alone would spin here for good: setting
            # pending=true below also holds off the refresh job, which is the
            # only other thing that would have caught it up.
            sync_state="unknown"
            for _ in 1 2 3; do
              sync_state="$(gh api "repos/$REPO/pulls/$existing" --jq '.mergeable_state')"
              [ "$sync_state" != "unknown" ] && break
              sleep 10
            done
            case "$sync_state" in
              behind)
                echo "Sync PR #$existing is behind; catching it up before re-arming auto-merge."
                gh api -X PUT "repos/$REPO/pulls/$existing/update-branch" \
                  || echo "::warning::could not update sync PR #$existing automatically"
                ;;
              dirty)
                echo "pending=true" >> "$GITHUB_OUTPUT"
                echo "::error::Sync PR #$existing conflicts with integration. Resolve $SYNC_BRANCH by hand and push it; auto-merge is deliberately left off until then."
                exit 1
                ;;
            esac
            echo "Sync PR #$existing is already open; leaving its branch as-is."
            # Same merge-then-squash preference as the freshly-opened PR below.
            # No `|| true`: if neither call can arm auto-merge, this path
            # would otherwise set pending=true, suppress `refresh`, and report a
            # green run while the sync PR sits open forever with nothing driving
            # it. Fail here, exactly as the freshly-opened PR below does.
            gh pr merge "$existing" --repo "$REPO" --auto --merge \
              || gh pr merge "$existing" --repo "$REPO" --auto --squash
            echo "pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch off `integration` and bring `main` in -- not the reverse --
          # so the head contains integration's tip and satisfies that same
          # strict up-to-date policy on the way back in.
          git checkout -B "$SYNC_BRANCH" origin/integration

          if [ -n "$marker" ]; then
            if ! merged="$(git merge-tree --write-tree --merge-base="$marker" \
                             HEAD origin/main)"; then
              echo "::error::main and integration have both changed the same lines since $marker. Resolve $SYNC_BRANCH by hand, push it, and open a PR into integration. Unlike the frozen-base case this one is a real disagreement -- read both sides before picking."
              exit 1
            fi
            git reset --hard --quiet "$(git commit-tree "$merged" \
              -p HEAD -p "$(git rev-parse origin/main)" \
              -m "Merge main into integration")"
          else
            # No marker yet -- first run, or the tag was lost. Git's inferred
            # base is all there is; a conflict here may well be the spurious
            # kind, and the marker written on the next clean pass prevents a
            # repeat.
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo "::error::could not merge main into integration and no $MARKER_TAG marker exists yet to supply a better base. Resolve $SYNC_BRANCH by hand and push it."
              exit 1
            fi
          fi

          if git diff --quiet origin/integration HEAD; then
            echo "merge changed nothing on integration; nothing to sync."
            record_marker "$(git rev-parse origin/main)"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No sync PR is open at this point, so nothing references the branch
          # and rebuilding it wholesale is safe.
          if ! git push --force origin "$SYNC_BRANCH"; then
            if ! git diff --quiet origin/integration HEAD -- .github/workflows/; then
              echo "::error::pushing $SYNC_BRANCH failed, and this sync carries changes under .github/workflows/ ($(git diff --name-only origin/integration HEAD -- .github/workflows/ | tr '\n' ' ')). GITHUB_TOKEN cannot create or update workflow files: set INTEGRATION_PROMOTE_TOKEN to a token holding the workflow scope. The checkout step above passes it to git as well as gh, so it covers this once configured."
            else
              echo "::error::pushing $SYNC_BRANCH failed."
            fi
            exit 1
          fi

          gh pr create \
            --repo "$REPO" \
            --base integration \
            --head "$SYNC_BRANCH" \
            --title "chore: sync integration with main" \
            --body "Brings \`main\`'s current files into \`integration\` so Dependabot branches from an up-to-date base, keeping any bumps \`integration\` is still holding. Opened automatically by .github/workflows/integration-sync.yml; auto-merges once CI is green. Nothing is authored here -- every change comes from one side or the other." \
            --label dependencies

          opened="$(gh pr list --repo "$REPO" --base integration \
            --head "$SYNC_BRANCH" --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')"

          # Auto-merge is the right primitive here, and safe in a way it is not
          # on `main`: integration-branch-protection requires no approving
          # review and carries no Copilot review rule, so there is no review to
          # race -- and the content merging in is main's own, already reviewed
          # on its way there.
          #
          # Prefer a real merge commit. It would make `main` an ancestor of
          # `integration` and keep git's own merge base current, which is what
          # the marker above is standing in for. Two settings gate it and both
          # are off today: the repository's "Allow merge commits", and "merge"
          # in allowed_merge_methods on integration-branch-protection. Turning
          # both on -- `main`'s ruleset need not change, so `main` keeps its
          # squash-only history -- makes this start using one with no edit
          # here. Until then it falls back to squash.
          gh pr merge "$opened" --repo "$REPO" --auto --merge \
            || gh pr merge "$opened" --repo "$REPO" --auto --squash
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "Sync PR #$opened is queued to merge."

  refresh:
    name: Catch up PRs integration left behind
    needs: sync
    # always(): on a push to `integration` the sync job is skipped, and a
    # skipped dependency would otherwise skip this one too. The pending guard
    # holds off while a sync PR is still queued -- `integration` is about to
    # move again, and catching everything up to the tip it is leaving would
    # just have to be redone.
    if: >-
      always()
      && (github.event_name != 'push' || github.ref_name == 'integration')
      && needs.sync.outputs.pending != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Catch up every open PR that integration outran
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_PROMOTE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Assign first, then iterate. A command substitution in a `for` word
          # list is only a word expansion, so `set -e` never sees `gh pr list`
          # fail -- an API or auth error would become an empty list, and the job
          # would report success having refreshed nothing at all. An assignment
          # does carry the substitution's exit status.
          #
          # --limit, because `gh pr list` returns 30 by default and this step
          # promises to catch up *every* open PR, not the newest thirty.
          open_prs="$(gh pr list --repo "$REPO" --base integration --state open \
                        --limit 200 --json number --jq '.[].number')"
          for n in $open_prs; do
            # mergeable_state is computed asynchronously; a PR polled too soon
            # after integration moved answers "unknown", which is neither state
            # below and would quietly skip the one PR that needed this most.
            state="unknown"
            for _ in 1 2 3 4 5 6; do
              state="$(gh api "repos/$REPO/pulls/$n" --jq '.mergeable_state')"
              [ "$state" != "unknown" ] && break
              sleep 10
            done

            case "$state" in
              behind)
                # Merge the base in. Deterministic, reports a status, and needs
                # nothing of the PR's author -- including Dependabot, whose own
                # branches take this happily: it leaves the bump commit in place
                # and does not close or abandon the PR.
                echo "PR #$n is behind; merging integration into it."
                gh api -X PUT "repos/$REPO/pulls/$n/update-branch" \
                  || echo "::warning::could not update PR #$n automatically"
                ;;

              dirty)
                # A conflict, which update-branch cannot fix. For a Dependabot
                # PR only Dependabot can: a bump that conflicts is usually a
                # lockfile, and regenerating one by merge resolution produces a
                # file no package manager would have written. `recreate` throws
                # the branch away and re-derives it from the current base.
                author="$(gh api "repos/$REPO/pulls/$n" --jq '.user.login')"
                if [ "$author" != "dependabot[bot]" ]; then
                  echo "::warning::PR #$n conflicts with integration and only its author can rebuild it; it needs a human."
                  continue
                fi
                # Don't keep asking: a request Dependabot silently drops would
                # otherwise collect a fresh comment on that PR for as long as it
                # stayed open. The window has to be longer than the schedule
                # above or it cannot do that job at all -- against a daily cron,
                # yesterday's request already falls outside a 24-hour lookback,
                # so the guard never fires and the comment lands anyway. A week
                # means at most one ask per stuck PR per week, which also
                # matches Dependabot's own cadence. Paginated, since `since`
                # bounds how old the comments are but not how many.
                since="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
                # Match this workflow's own marker, not the command text.
                # Anyone who can comment on the PR could otherwise post -- or
                # merely quote -- "@dependabot recreate" and suppress the real
                # request for the whole window, without Dependabot having acted
                # on theirs at all.
                # Interpolated rather than passed with --arg: gh's --jq takes
                # one filter string and forwards no jq options, so --arg would
                # be swallowed as the filter itself. Safe here because the
                # marker contains no double quotes.
                asked="$(gh api --paginate \
                  "repos/$REPO/issues/$n/comments?since=$since&per_page=100" \
                  --jq ".[] | select(.body | contains(\"$RECREATE_MARKER\")) | .id" \
                  | wc -l)"
                if [ "$asked" -gt 0 ]; then
                  echo "PR #$n conflicts but was already asked to recreate since $since; leaving it."
                  continue
                fi
                echo "PR #$n conflicts with integration; asking Dependabot to recreate it."
                # printf, not a multi-line string: the marker would otherwise
                # inherit this block's indentation, and four leading spaces make
                # markdown render it as a code block -- an HTML comment meant to
                # be invisible, shown verbatim on the PR.
                gh pr comment "$n" --repo "$REPO" \
                  --body "$(printf '@dependabot recreate\n\n%s' "$RECREATE_MARKER")"
                ;;

              *)
                echo "PR #$n is '$state'; nothing for this job to do."
                ;;
            esac
          done
