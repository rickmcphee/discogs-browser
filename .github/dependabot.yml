# Grouping is about deploy count, not PR count: every merge to main is a push,
# and every push to main runs the Fly deploy job. Ungrouped, the first run after
# this file landed opened 12 PRs, which is 12 sequential production deploys.
#
# Minor and patch updates are grouped per ecosystem -- one PR, one deploy.
# Majors are deliberately left ungrouped so they arrive one at a time and get
# read. Security updates are also left ungrouped: they bypass
# open-pull-requests-limit by design and should stay individually mergeable
# rather than waiting on a batch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The base image tags are floating (`3.11-slim`, `20-alpine`), so patch
  # updates already arrive at build time and Dependabot has nothing to raise.
  # What it does propose -- python 3.11 -> 3.14, node 20 -> 26 -- has to move in
  # lockstep with the `python-version` and `node-version` pins in
  # .github/workflows/fly-deploy.yml, which Dependabot cannot do. Left to
  # itself it silently diverges the runtime from the one CI tests against, so
  # those two move by hand.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
