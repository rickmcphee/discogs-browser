services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: discogs_browser
    # Plain bind mount, same convention as backend's ./workspace below -- for
    # a NAS deployment, point the whole project checkout at NAS storage and
    # this lands there automatically, no compose changes needed.
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - ./workspace:/data
    environment:
      DISCOGS_BROWSER_DATA: /data
      PLAYWRIGHT_CHANNEL: ""
      DATABASE_URL: postgresql://postgres@postgres:5432/discogs_browser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      DISCOGS_CONSUMER_KEY: ${DISCOGS_CONSUMER_KEY}
      DISCOGS_CONSUMER_SECRET: ${DISCOGS_CONSUMER_SECRET}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
