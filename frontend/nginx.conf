server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # The recommendations import accepts up to 10 MB (see
        # recommendations_import.MAX_UPLOAD_BYTES); nginx's 1 MiB default would
        # reject a realistic export before it reached the backend. Slightly
        # above the app's own limit so the backend returns its specific 413
        # rather than nginx returning a generic one.
        client_max_body_size 12m;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Required for SSE: disable buffering and keep connection alive
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
