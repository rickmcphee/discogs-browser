[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discogs-browser"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rapidfuzz>=3.14.5",
    "sse-starlette>=3.4.8",
    "anthropic>=0.28",
    "playwright>=1.62.0",
    "playwright-stealth>=1.0.6",
    "apscheduler>=3.10,<4.0",
    "python-multipart>=0.0.9",
    "Pillow>=12.3.0",
    "psycopg[binary]>=3.1,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "cryptography>=50.0.0,<51",
    # <1.8: authlib 1.8.0's httpx_client transports over httpx2 whenever it is
    # importable (and anthropic always installs it), which respx cannot
    # intercept -- the OAuth1 test mocks silently stop applying and tests hit
    # the live Discogs API. Lift only together with an httpx2-aware mocking
    # strategy for discogs.py/oauth_discogs.py.
    "authlib>=1.7.2,<1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.23.1",
    "pytest-dotenv>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
