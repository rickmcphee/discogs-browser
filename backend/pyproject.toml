[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discogs-browser"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rapidfuzz>=3.14.5",
    "sse-starlette>=3.4.8",
    "anthropic>=1.0.0",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "apscheduler>=3.11.3,<4.0",
    "python-multipart>=0.0.32",
    "Pillow>=12.3.0",
    "psycopg[binary]>=3.1,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "cryptography>=50.0.0,<51",
    # >=1.8: from 1.8 authlib's httpx_client transports over httpx2 whenever
    # it is importable, and the tests mock through a transport injected into
    # the OAuth1 clients (conftest.py's bridge fixture) whose module selection
    # mirrors that same rule. 1.7.x always transports over httpx regardless,
    # which would put the bridge's httpx2 responses inside an httpx client --
    # the floor keeps both sides choosing identically.
    "authlib>=1.8,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.23.1",
    "pytest-dotenv>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
