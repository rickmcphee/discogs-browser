app = "tracktempest-api"
primary_region = "ord"

[build]

[env]
  PLAYWRIGHT_CHANNEL = ""
  DISCOGS_BROWSER_DATA = "/data"
  # Cloudflare is the deployment's DNS/proxy in front of api.tracktempest.com
  # (see docs/specifications/shaping/2026-08-08-fly-neon-deployment-design.md),
  # so CF-Connecting-IP is trustworthy here -- see _client_key in
  # backend/routers/session.py for what this actually changes and why.
  # Direct access to the app's own <app>.fly.dev hostname (bypassing
  # Cloudflare, and therefore this header's guarantee) is a known, tracked
  # gap, not fixed by this flag -- see the separate follow-up for that.
  TRUST_CF_CONNECTING_IP = "1"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
