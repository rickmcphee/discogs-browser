app = "tracktempest-api"
primary_region = "ord"

[build]

[env]
  PLAYWRIGHT_CHANNEL = ""
  DISCOGS_BROWSER_DATA = "/data"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
