app = "tracktempest-api"
primary_region = "ord"

[build]

[env]
  PLAYWRIGHT_CHANNEL = ""
  DISCOGS_BROWSER_DATA = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
